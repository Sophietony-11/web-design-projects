<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Proceed to Checkout</title>
    <style>
        /* Reset margin and padding */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f8f8;
            color: #333;
            line-height: 1.6;
        }

        .checkout-container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 30px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-align: center;
            color: #333;
        }

        .checkout-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 1.1rem;
            color: #555;
        }

        input,
        textarea {
            padding: 12px;
            font-size: 1rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            width: 100%;
            background-color: #f7f7f7;
        }

        textarea {
            height: 120px;
        }

        button {
            padding: 12px;
            font-size: 1.1rem;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #555;
        }

        /* Navigation Buttons Styling */
        .navigation-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        .navigation-buttons a {
            width: 48%;
        }

        .navigation-buttons button {
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            background-color: #f4f4f4;
            color: #333;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .navigation-buttons button:hover {
            background-color: #ddd;
        }

        /* Proceed Button Styling */
        .proceed-btn {
            width: 100%;
            padding: 15px;
            background-color: #333;
            color: white;
            text-align: center;
            font-size: 1.2rem;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            margin-top: 20px;
            text-transform: uppercase;
            transition: background-color 0.3s ease;
        }

        .proceed-btn:hover {
            background-color: #555;
        }
    </style>
</head>

<body>

    <!-- Checkout Container -->
    <div class="checkout-container" id="checkout">
        <h2>Proceed to Checkout</h2>

        <!-- Checkout Form -->
        <form class="checkout-form">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="address">Shipping Address</label>
                <textarea id="address" name="address" required></textarea>
            </div>

            <div class="form-group">
                <label for="payment">Payment Method</label>
                <input type="text" id="payment" name="payment" required>
            </div>

            <!-- Submit Button -->
            <button type="submit">Complete Purchase</button>
        </form>

        <!-- Navigation Buttons (Back to Cart and Back to Home) -->
        <div class="navigation-buttons">
            <a href="myCheckout.html">
                <button>Back to Cart</button>
            </a>
            <a href="myfp2.html">
                <button>Back to Home</button>
            </a>
        </div>

        <!-- Proceed to Checkout Button -->
        <button class="proceed-btn" onclick="document.getElementById('checkout').scrollIntoView();">
            Proceed to Checkout
        </button>
    </div>

</body>

</html>
