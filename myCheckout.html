<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Perfume Shop - Cart</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        header {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            display: flex;
            justify-content: center;
            background-color: #222;
            padding: 10px;
        }

        nav a {
            color: white;
            padding: 14px 20px;
            text-decoration: none;
            text-align: center;
        }

        nav a:hover {
            background-color: #575757;
        }

        .cart-container {
            width: 80%;
            margin: 20px auto;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background-color: #333;
            color: white;
            border-radius: 8px;
        }

        .cart-header h2 {
            margin: 0;
        }

        .cart-items {
            margin-top: 20px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            background-color: white;
            padding: 20px;
            margin: 10px 0;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .cart-item img {
            width: 120px;
            height: auto;
            border-radius: 5px;
        }

        .cart-item-details {
            flex: 1;
            margin-left: 20px;
        }

        .cart-item-details h3 {
            font-size: 1.2em;
            margin: 10px 0;
        }

        .cart-item-details .price {
            font-size: 1.2em;
            color: #333;
        }

        .cart-item-details .quantity {
            font-size: 1em;
            color: #777;
        }

        .cart-footer {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            background-color: #333;
            color: white;
            border-radius: 8px;
        }

        .cart-footer .total {
            font-size: 1.5em;
        }

        .cart-footer button {
            padding: 10px 20px;
            background-color: #ff9900;
            border: none;
            color: white;
            font-size: 1em;
            cursor: pointer;
        }

        .cart-footer button:hover {
            background-color: #ff6600;
        }
    </style>
</head>

<body>
    <!-- Header Section -->
    <header>
        <h1>Your Cart</h1>
    </header>

    <!-- Navigation Bar -->
    <nav>
        <a href="myfp2.html">Home</a>
        <a href="myshp.html">Shop</a>
        <a href="myshp.html#Contact-info">Contact</a>
    </nav>

    <!-- Cart Section -->
    <div class="cart-container">
        <div class="cart-header">
            <h2>Your Shopping Cart</h2>
            <span>Total Items: 4</span>
        </div>

        <!-- Cart Items -->
        <div class="cart-items">
            <!-- Product 1 -->
            <div class="cart-item">
                <img src="https://t3.ftcdn.net/jpg/09/42/55/00/240_F_942550039_KL4viqhrs2Rxv9iIxViL0Smy2i7hda4I.jpg" alt="Hugo Boss Bottled">
                <div class="cart-item-details">
                    <h3>Hugo Boss Bottled</h3>
                    <p class="quantity">Quantity: 1</p>
                    <p class="price">$150.00</p>
                </div>
            </div>

            <!-- Product 2 -->
            <div class="cart-item">
                <img src="https://t4.ftcdn.net/jpg/03/98/30/59/240_F_398305943_8aO1DxIhn3M7KozTf2UA8ats0b4XinQg.jpg" alt="Elegant perfume bottle">
                <div class="cart-item-details">
                    <h3>Elegant Garden Perfume</h3>
                    <p class="quantity">Quantity: 1</p>
                    <p class="price">$180.00</p>
                </div>
            </div>

            <!-- Product 3 -->
            <div class="cart-item">
                <img src="https://t4.ftcdn.net/jpg/08/89/76/59/240_F_889765938_hvBF8Fkc2gMDEtzmyRk1mTxozf7cT4XW.jpg" alt="Rose Musk Oil">
                <div class="cart-item-details">
                    <h3>Rose Musk Perfume Oil</h3>
                    <p class="quantity">Quantity: 1</p>
                    <p class="price">$45.00</p>
                </div>
            </div>

            <!-- Product 4 -->
            <div class="cart-item">
                <img src="https://t3.ftcdn.net/jpg/09/03/69/54/240_F_903695490_Pu8YZ6abafOLAuGt8ZPGseb8knl0Q94p.jpg" alt="Perfume on Water Surface">
                <div class="cart-item-details">
                    <h3>Water Essence Perfume</h3>
                    <p class="quantity">Quantity: 1</p>
                    <p class="price">$200.00</p>
                </div>
            </div>
        </div>

        <!-- Cart Footer -->
        <div class="cart-footer">
            <div class="total">
                <p>Total: $575.00</p>
            </div>
			  <a href="MYP2C.html">
            <button>Proceed to Checkout</button>
        </div>
    </div>
     
           

</body>

</html>
