<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }
        .login-container h2 {
            margin-bottom: 20px;
            text-align: center;
        }
        .login-container input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        .login-container button {
            width: 100%;
            padding: 10px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .login-container button:hover {
            background-color: #575757;
        }
        .login-container .links {
            text-align: center;
        }
        .login-container .links a {
            color: #333;
            text-decoration: none;
        }
        .login-container .links a:hover {
            text-decoration: underline;
        }
        .login-container .footer-links {
            margin-top: 20px;
            text-align: center;
        }
        .login-container .footer-links a {
            margin: 0 10px;
            color: #333;
            text-decoration: none;
        }
        .login-container .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Login</h2>
        <form action="/login" method="POST">
            <input type="email" placeholder="Email" required>
            <input type="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <div class="links">
            <p><a href="mysignup.html">Don't have an account? Sign up</a></p>
            <p><a href="myforgot-password.html">Forgot Password?</a></p>
        </div>
        
        <!-- Footer Links (Back to Cart and Home) -->
        <div class="footer-links">
            <p><a href="myCheckout.html">Back to Cart</a></p>
            <p><a href="myfp2.html">Back to Home</a></p>
        </div>
    </div>
</body>
</html>
