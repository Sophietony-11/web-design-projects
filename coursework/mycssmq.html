<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<style>
#tag0 {
			display: none;
            color:black;
					background-color : orange
				}
@media (orientation: Portrait) {
#tag1 {
			display: visible;
            color:black;
					background-color : red
				}
}
@media (orientation: landscape) {
#tag2 {
			display: visible;
            color:black;
					background-color : green
				}
          }      
@media (min-width: 540px) {
#tag3{
			display: visible;
            color:black;
					background-color : blue
				}
}
		@media (min-height: 550px) {
        #tag4 {
			display: visible;
            color:black;
					background-color : orange
			}
   }
@media (min-width: 600px) and (min-height: 600px) {
       #tag5 {
                display: visible;
                color: black;
                background-color: pink;
            }
        }
    </style>
</head>

<body>
    <h1 id="tag1" class="tag">Portrait Mode</h1>
    <h1 id="tag2" class="tag">Landscape Mode</h1>
    <h1 id="tag3" class="tag">>500 wide</h1>
    <h1 id="tag4" class="tag">>500 tall</h1>
    <h1 id="tag5" class="tag">big</h1>


</body>
</html>
